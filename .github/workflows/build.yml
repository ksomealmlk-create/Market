name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -o GroceryApp.zip -d proj
          find proj -maxdepth 4 -not -path '*/.*'

      - name: Build APK
        run: |
          SETTINGS=$(find proj -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GroceryApp-debug
          path: proj/**/build/outputs/apk/debug/*.apk
